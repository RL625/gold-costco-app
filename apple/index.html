<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>好市多 Apple 專區</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--bd:#2d3a4f;--a:#0a84ff;--mu:#8b9bb4;--g:#22c55e;--r:#ef4444;--w:#e8eef7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--w);font-family:system-ui,-apple-system,sans-serif;max-width:1100px;margin:0 auto;padding:0 14px 48px}
header{text-align:center;padding:22px 0 16px;border-bottom:1px solid var(--bd);margin-bottom:12px}
header h1{font-size:clamp(1.35rem,4vw,1.75rem)}
header p{color:var(--mu);font-size:.88rem;margin-top:6px}
header a{color:var(--a);text-decoration:none;font-size:.85rem;margin:0 6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.toolbar input{flex:1;min-width:160px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--w);font-size:.95rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{background:transparent;border:1px solid var(--bd);color:var(--mu);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.82rem}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a);font-weight:600}
.meta{font-size:.8rem;color:var(--mu);margin:8px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:contain;background:#111;padding:10px}
.card .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .name{font-size:.9rem;line-height:1.35;flex:1}
.card .price{font-size:1.15rem;font-weight:700;color:#fff}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;font-weight:600}
.in{background:rgba(34,197,94,.2);color:var(--g)}
.out{background:rgba(239,68,68,.15);color:var(--r)}
.cat{font-size:.72rem;color:var(--mu)}
.buy{display:inline-block;margin-top:6px;padding:8px 12px;background:var(--a);color:#fff;border-radius:8px;text-decoration:none;font-size:.85rem;text-align:center}
.buy:hover{opacity:.9}
.rbtn{background:transparent;border:1px solid var(--bd);color:var(--mu);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.82rem}
footer{text-align:center;padding:24px;color:var(--mu);font-size:.78rem}
.empty{text-align:center;padding:40px;color:var(--mu)}
</style>
</head>
<body>
<header>
  <h1> 好市多 Apple 專區</h1>
  <p>僅列出好市多台灣線上「品牌 = Apple」商品</p>
  <p>
    <a href="https://www.costco.com.tw/Apple/c/Apple" target="_blank" rel="noopener">官方 Apple 分類 →</a>
    <a href="https://rl625.github.io/gold-costco-app/">金脈</a>
  </p>
</header>

<div class="toolbar">
  <input id="q" type="search" placeholder="搜尋商品名稱或編號…" autocomplete="off"/>
  <button class="rbtn" id="btnStock">只看有貨</button>
</div>
<div class="tabs" id="tabs"></div>
<p class="meta" id="meta">載入中…</p>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">沒有符合的商品</div>
<footer>資料快照自 costco.com.tw（brand:Apple）· 價格與庫存以官網為準 · 非官方工具</footer>

<script>
var DATA=null, CAT='全部', ONLY_STOCK=false, Q='';
var CATS=['全部','iPhone','iPad','Mac','Apple Watch','AirPods','AirTag','配件','其他'];

function money(p,t){
  if(t && t!=='—') return t.startsWith('$')||t.startsWith('NT')?t:('NT$'+t);
  if(p==null) return '登入顯示 / 未標價';
  return 'NT$'+Number(p).toLocaleString('zh-TW',{maximumFractionDigits:0});
}
function fullUrl(u){ if(!u) return 'https://www.costco.com.tw/Apple/c/Apple'; return u.startsWith('http')?u:('https://www.costco.com.tw'+u); }
function fullImg(g){ if(!g) return ''; return g.startsWith('http')?g:('https://www.costco.com.tw'+g); }

function filtered(){
  if(!DATA) return [];
  var list=DATA.items||[];
  return list.filter(function(x){
    if(ONLY_STOCK && x.s!==1) return false;
    if(CAT!=='全部' && x.k!==CAT) return false;
    if(Q){
      var s=(x.n+' '+x.c).toLowerCase();
      if(s.indexOf(Q)<0) return false;
    }
    return true;
  });
}

function render(){
  var list=filtered();
  var grid=document.getElementById('grid');
  var empty=document.getElementById('empty');
  var meta=document.getElementById('meta');
  var total=(DATA&&DATA.items)?DATA.items.length:0;
  var inStock=(DATA&&DATA.items)?DATA.items.filter(function(x){return x.s===1}).length:0;
  meta.textContent='顯示 '+list.length+' 件 · 快照共 '+total+' 件（有貨 '+inStock+'） · 更新 '+(DATA&&DATA.updated?DATA.updated:'—');
  if(!list.length){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML=list.map(function(x){
    var stock=x.s===1?'<span class="badge in">有貨</span>':(x.s===2?'<span class="badge in">庫存少</span>':'<span class="badge out">缺貨</span>');
    var img=fullImg(x.g);
    var imgHtml=img?'<img src="'+img+'" alt="" loading="lazy"/>':'<div style="aspect-ratio:1;background:#111"></div>';
    return '<div class="card">'+imgHtml+'<div class="body"><div class="cat">'+x.k+' · #'+x.c+'</div><div class="name">'+x.n+'</div><div class="price">'+money(x.p,x.t)+'</div><div>'+stock+'</div><a class="buy" href="'+fullUrl(x.u)+'" target="_blank" rel="noopener">在好市多查看</a></div></div>';
  }).join('');
}

function buildTabs(){
  var el=document.getElementById('tabs');
  el.innerHTML=CATS.map(function(c){
    return '<button data-c="'+c+'" class="'+(c===CAT?'on':'')+'">'+c+'</button>';
  }).join('');
  el.onclick=function(e){
    var b=e.target.closest('button[data-c]'); if(!b) return;
    CAT=b.getAttribute('data-c');
    [].forEach.call(el.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});
    render();
  };
}

document.getElementById('q').addEventListener('input',function(e){ Q=(e.target.value||'').trim().toLowerCase(); render(); });
document.getElementById('btnStock').onclick=function(){
  ONLY_STOCK=!ONLY_STOCK;
  this.textContent=ONLY_STOCK?'顯示全部':'只看有貨';
  this.style.borderColor=ONLY_STOCK?'#0a84ff':'';
  this.style.color=ONLY_STOCK?'#0a84ff':'';
  render();
};

fetch('./data.json?v='+Date.now()).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
.then(function(d){ DATA=d; buildTabs(); render(); })
.catch(function(e){ document.getElementById('meta').textContent='載入失敗：'+(e.message||e); });
</script>
</body>
</html>
