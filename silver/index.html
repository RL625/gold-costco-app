<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>銀脈終端 SilverVein</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
Promise.all([0,1,2,3].map(function(i){
  return fetch('./sv'+i+'.b64?v=3').then(function(r){ if(!r.ok) throw new Error('sv'+i); return r.text(); });
})).then(function(parts){
  var bin = Uint8Array.from(atob(parts.join('')), function(c){ return c.charCodeAt(0); });
  document.open(); document.write(pako.ungzip(bin, {to:'string'})); document.close();
}).catch(function(e){
  document.body.innerHTML='<div style="padding:24px;background:#0f1419;color:#e8eef7;font-family:sans-serif"><h1>銀脈終端</h1><p>'+(e.message||e)+'</p><a href="https://rl625.github.io/gold-costco-app/" style="color:#c0c7d1">金脈</a></div>';
});
</script>
</head>
<body style="background:#0f1419;color:#8b9bb4;padding:24px;font-family:sans-serif">載入銀脈終端…</body>
</html>
