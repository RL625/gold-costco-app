<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>金脈終端 GoldVein</title>
<script>
// 從本站最新部署載入完整應用（不再依賴 jsDelivr / 舊 commit）
const SRC = './app.html?v=' + Date.now();
fetch(SRC)
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
  .then(function(html){
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function(e){
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px;background:#0f1419;color:#e8eef7">載入失敗：' +
      (e && e.message ? e.message : e) +
      '<br><br><a style="color:#d4af37" href="./app.html">直接開啟 app.html</a>' +
      '<br><a style="color:#d4af37" href="./btc/">鏈脈終端（比特幣）</a></p>';
  });
</script>
</head>
<body style="background:#0f1419;color:#8b9bb4;font-family:sans-serif;padding:24px">載入金脈終端最新版…</body>
</html>
