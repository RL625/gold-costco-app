<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>鏈脈終端 ChainVein</title>
<link rel="canonical" href="https://rl625.github.io/gold-costco-app/btc/"/>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
Promise.all([
  fetch('./bp0.b64?v=1').then(function(r){if(!r.ok)throw new Error('bp0 '+r.status);return r.text()}),
  fetch('./bp1.b64?v=1').then(function(r){if(!r.ok)throw new Error('bp1 '+r.status);return r.text()}),
  fetch('./bp2.b64?v=1').then(function(r){if(!r.ok)throw new Error('bp2 '+r.status);return r.text()}),
  fetch('./bp3.b64?v=1').then(function(r){if(!r.ok)throw new Error('bp3 '+r.status);return r.text()}),
  fetch('./bp4.b64?v=1').then(function(r){if(!r.ok)throw new Error('bp4 '+r.status);return r.text()}),
  fetch('./bp5.b64?v=1').then(function(r){if(!r.ok)throw new Error('bp5 '+r.status);return r.text()}),
  fetch('./bp6.b64?v=1').then(function(r){if(!r.ok)throw new Error('bp6 '+r.status);return r.text()}),
  fetch('./bp7.b64?v=1').then(function(r){if(!r.ok)throw new Error('bp7 '+r.status);return r.text()})
]).then(function(parts){
  var b64 = parts.join('');
  var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
  var html = pako.ungzip(bin, {to: 'string'});
  document.open(); document.write(html); document.close();
}).catch(function(e){
  document.body.innerHTML = '<div style="font-family:sans-serif;padding:24px;background:#0c0f14;color:#e8eef7"><h1 style="color:#f7931a">鏈脈終端</h1><p>載入失敗：'+(e&&e.message?e.message:e)+'</p><p><a style="color:#f7931a" href="https://rl625.github.io/gold-costco-app/">金脈終端</a></p></div>';
});
</script>
</head>
<body style="background:#0c0f14;color:#8b9bb4;font-family:sans-serif;padding:24px">載入鏈脈終端（對齊金脈版面）…</body>
</html>
