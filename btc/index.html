<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>鏈脈終端 ChainVein</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
Promise.all([fetch('./b0.b64?v=2').then(r=>{if(!r.ok)throw new Error('b0 '+r.status);return r.text()}),fetch('./b1.b64?v=2').then(r=>{if(!r.ok)throw new Error('b1 '+r.status);return r.text()}),fetch('./b2.b64?v=2').then(r=>{if(!r.ok)throw new Error('b2 '+r.status);return r.text()})]).then(function(parts){
  var b64 = parts.join('');
  var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
  var html = pako.ungzip(bin, {to: 'string'});
  document.open();
  document.write(html);
  document.close();
}).catch(function(e){
  document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px;background:#0c0f14;color:#e8eef7">載入失敗：' +
    (e && e.message ? e.message : e) +
    '<br><br><a style="color:#f7931a" href="../">金脈終端（黃金）</a></p>';
});
</script>
</head>
<body style="background:#0c0f14;color:#8b9bb4;font-family:sans-serif;padding:24px">載入鏈脈終端最新部署…</body>
</html>
