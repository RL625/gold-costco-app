<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鏈脈終端 ChainVein · 比特幣分析</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #0c0f14; --card: #161b22; --border: #2a3340; --accent: #f7931a;
      --text: #e8eef7; --muted: #8b9bb4; --green: #22c55e; --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
      padding: clamp(10px, 2.5vw, 20px);
    }
    .container { width: 100%; max-width: 960px; margin: 0 auto; }
    header { text-align: center; padding: 20px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    header h1 {
      font-size: clamp(1.25rem, 4.5vw, 1.75rem);
      background: linear-gradient(135deg, var(--accent), #ffd4a0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
    header a { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; margin-bottom: 16px;
    }
    .card h2 {
      font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center;
      gap: 8px; flex-wrap: wrap;
    }
    .price-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px; margin-bottom: 12px;
    }
    .price-box {
      background: rgba(247, 147, 26, 0.08); border: 1px solid rgba(247, 147, 26, 0.28);
      border-radius: 12px; padding: 12px; text-align: center;
    }
    .price-box .label { font-size: 0.75rem; color: var(--muted); }
    .price-box .value { font-size: 1.2rem; font-weight: 700; color: var(--accent); margin: 4px 0; }
    .price-box .sub { font-size: 0.8rem; color: var(--muted); }
    .change-up { color: var(--green); } .change-down { color: var(--red); }
    .period-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .period-btns button {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 0.85rem;
    }
    .period-btns button.active, .period-btns button:hover {
      background: var(--accent); color: #0c0f14; border-color: var(--accent); font-weight: 600;
    }
    .chart-wrap { position: relative; height: 280px; width: 100%; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.75rem; }
    .advice-box {
      background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px; padding: 14px; margin-top: 12px;
    }
    .advice-box.strong-buy { border-color: var(--green); background: rgba(34, 197, 94, 0.1); }
    .loading { color: var(--muted); text-align: center; padding: 20px; }
    .refresh-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; margin-left: auto;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
    .status { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; }
    .status.live { color: var(--green); } .status.fallback { color: var(--accent); }
    .signal-board {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px; margin: 12px 0;
    }
    .signal-cell {
      background: rgba(0,0,0,0.28); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 8px; text-align: center;
    }
    .signal-cell .lab { font-size: 0.72rem; color: var(--muted); margin-bottom: 6px; }
    .signal-cell .light {
      width: 18px; height: 18px; border-radius: 50%; margin: 0 auto 8px;
      box-shadow: 0 0 10px currentColor;
    }
    .light-green { background: #22c55e; color: #22c55e; }
    .light-yellow { background: #f5c518; color: #f5c518; }
    .light-red { background: #ef4444; color: #ef4444; }
    .signal-cell .val { font-size: 0.85rem; font-weight: 600; }
    .go-banner {
      border-radius: 14px; padding: 16px; margin: 14px 0 8px;
      display: flex; flex-wrap: wrap; gap: 12px; border: 1px solid var(--border);
    }
    .go-banner.go-yes { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.45); }
    .go-banner.go-wait { background: rgba(247,147,26,0.12); border-color: rgba(247,147,26,0.4); }
    .go-banner.go-no { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); }
    .go-banner .go-title { font-size: 1.15rem; font-weight: 800; }
    .go-banner .go-sub { font-size: 0.88rem; color: var(--muted); flex: 1; min-width: 160px; }
    .k-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .k-card {
      background: rgba(0,0,0,0.25); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px;
    }
    .k-card h4 { font-size: 0.95rem; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
    .k-card .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .rec { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
    .rec-buy { background: rgba(34,197,94,0.2); color: var(--green); }
    .rec-hold { background: rgba(247,147,26,0.2); color: var(--accent); }
    .rec-wait { background: rgba(239,68,68,0.15); color: var(--red); }
    .disclaimer {
      font-size: 0.75rem; color: var(--muted); text-align: center;
      margin-top: 24px; padding: 16px; border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>₿ 鏈脈終端 ChainVein</h1>
      <p>比特幣報價 · BTCUSDT 合約訊號 · K 線分析</p>
      <p style="margin-top:8px"><a href="https://rl625.github.io/gold-costco-app/">← 金脈終端（黃金版）</a></p>
    </header>

    <div class="card">
      <h2>📈 即時比特幣 <button class="refresh-btn" onclick="loadSpot()">重新整理</button></h2>
      <div id="spotLoading" class="loading">載入中...</div>
      <div id="spotContent" style="display:none">
        <div class="price-grid">
          <div class="price-box">
            <div class="label">USD / BTC</div>
            <div class="value" id="priceUsd">—</div>
            <div class="sub" id="changeUsd">—</div>
          </div>
          <div class="price-box">
            <div class="label">TWD / BTC</div>
            <div class="value" id="priceTwd">—</div>
            <div class="sub" id="changeTwd">—</div>
          </div>
          <div class="price-box">
            <div class="label">約 TWD / 0.001 BTC</div>
            <div class="value" id="priceMbtc">—</div>
            <div class="sub">1 mBTC</div>
          </div>
          <div class="price-box">
            <div class="label">約 TWD / 整顆</div>
            <div class="value" id="priceUnit">—</div>
            <div class="sub">1 BTC</div>
          </div>
        </div>
        <p style="font-size:0.8rem;color:var(--muted)" id="updatedAt">—</p>
      </div>
    </div>

    <div class="card">
      <h2>📉 BTCUSDT 合約開單儀表板 <button class="refresh-btn" onclick="loadPanel()">重新整理</button></h2>
      <p style="font-size:0.9rem;color:var(--muted);margin-bottom:10px">
        結論、燈號、參數同一套計算。資料來源 CoinGecko（台灣地區幣安 API 常被擋）。
      </p>
      <div class="period-btns" id="periodBtns">
        <button data-days="7">7 天</button>
        <button class="active" data-days="30">30 天</button>
        <button data-days="90">90 天</button>
        <button data-days="180">半年</button>
        <button data-days="365">1 年</button>
      </div>
      <div id="btcCandle" class="chart-wrap"></div>
      <p id="panelStatus" class="status">準備載入…</p>
      <div id="dashboard"></div>
      <div id="panelBody"></div>
    </div>

    <div class="card">
      <h2>📊 各週期分析 <button class="refresh-btn" onclick="loadKAnalysis()">重新分析</button></h2>
      <div id="kLoading" class="loading">分析中...</div>
      <div id="kContent" style="display:none">
        <div class="k-grid" id="kGrid"></div>
      </div>
    </div>

    <div class="disclaimer">
      鏈脈終端 ChainVein 僅供資訊參考。加密貨幣與合約波動極大，可能損失全部本金。非投資建議。
    </div>
  </div>

  <script>
    const CG = 'https://api.coingecko.com/api/v3';
    let days = 30;
    let lastPlan = null;
    let candleChart = null;

    function sma(arr, n) {
      const out = new Array(arr.length).fill(null);
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        sum += arr[i];
        if (i >= n) sum -= arr[i - n];
        if (i >= n - 1) out[i] = sum / n;
      }
      return out;
    }

    function rsi(closes, n) {
      n = n || 14;
      const out = new Array(closes.length).fill(null);
      if (closes.length < n + 1) return out;
      let gains = 0, losses = 0;
      for (let i = 1; i <= n; i++) {
        const d = closes[i] - closes[i - 1];
        if (d >= 0) gains += d; else losses -= d;
      }
      let avgG = gains / n, avgL = losses / n;
      out[n] = avgL === 0 ? 100 : 100 - (100 / (1 + avgG / avgL));
      for (let i = n + 1; i < closes.length; i++) {
        const d = closes[i] - closes[i - 1];
        const g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
        avgG = (avgG * (n - 1) + g) / n;
        avgL = (avgL * (n - 1) + l) / n;
        out[i] = avgL === 0 ? 100 : 100 - (100 / (1 + avgG / avgL));
      }
      return out;
    }

    function atr(ohlc, n) {
      n = n || 14;
      const tr = [];
      for (let i = 0; i < ohlc.length; i++) {
        const h = ohlc[i].h, l = ohlc[i].l, c = i ? ohlc[i - 1].c : ohlc[i].c;
        tr.push(Math.max(h - l, Math.abs(h - c), Math.abs(l - c)));
      }
      return sma(tr, n);
    }

    async function fetchOhlc(d) {
      const map = { 7: 7, 30: 30, 90: 90, 180: 180, 365: 365 };
      const q = map[d] || 30;
      const res = await fetch(CG + '/coins/bitcoin/ohlc?vs_currency=usd&days=' + q);
      if (!res.ok) throw new Error('CoinGecko OHLC ' + res.status);
      const raw = await res.json();
      return raw.map(r => ({
        t: r[0],
        time: Math.floor(r[0] / 1000),
        o: r[1], h: r[2], l: r[3], c: r[4]
      })).filter(x => x.c > 0);
    }

    function buildPlan(ohlc) {
      if (!ohlc || ohlc.length < 20) return null;
      const closes = ohlc.map(x => x.c);
      const last = closes[closes.length - 1];
      const ma20 = sma(closes, 20);
      const ma50 = sma(closes, Math.min(50, closes.length));
      const lastMa20 = ma20[ma20.length - 1];
      const lastMa50 = ma50[ma50.length - 1];
      const lastRsi = rsi(closes, 14).slice(-1)[0];
      const lastAtr = atr(ohlc, 14).slice(-1)[0] || last * 0.02;

      let score = 0;
      const bull = last > lastMa20 && lastMa20 > lastMa50;
      const bear = last < lastMa20 && lastMa20 < lastMa50;
      if (bull) score += 3;
      else if (last > lastMa20 && last > lastMa50) score += 2;
      else if (last > lastMa20) score += 1;
      if (bear) score -= 3;
      else if (last < lastMa20 && last < lastMa50) score -= 2;
      else if (last < lastMa20) score -= 1;
      if (lastRsi != null && lastRsi < 30) score += 1;
      if (lastRsi != null && lastRsi > 70) score -= 1;

      let bias = '中性', direction = '觀望';
      if (score >= 2) { bias = '偏多'; direction = '做多 (Long)'; }
      else if (score <= -2) { bias = '偏空'; direction = '做空 (Short)'; }

      let leverage = lastAtr / last > 0.04 ? 2 : (lastAtr / last > 0.025 ? 3 : 5);
      leverage = Math.min(10, Math.max(2, leverage));

      let entry = last, sl, tp1, tp2;
      if (direction.indexOf('做多') >= 0) {
        sl = last - 1.5 * lastAtr; tp1 = last + 2 * lastAtr; tp2 = last + 3.5 * lastAtr;
      } else if (direction.indexOf('做空') >= 0) {
        sl = last + 1.5 * lastAtr; tp1 = last - 2 * lastAtr; tp2 = last - 3.5 * lastAtr;
      } else {
        sl = last - 1.2 * lastAtr; tp1 = last + 1.5 * lastAtr; tp2 = last + 2.5 * lastAtr;
      }
      const risk = Math.abs(entry - sl) || 1;
      return {
        bias, direction, score, last, lastRsi, lastAtr, entry, sl, tp1, tp2, leverage,
        rr1: Math.abs(tp1 - entry) / risk, rr2: Math.abs(tp2 - entry) / risk,
        ma20: lastMa20, ma50: lastMa50
      };
    }

    function buildSignals(plan) {
      if (!plan) return null;
      let trend = 'yellow', trendText = '盤整';
      if (plan.last > plan.ma20 && plan.ma20 > plan.ma50) { trend = 'green'; trendText = '多頭排列'; }
      else if (plan.last < plan.ma20 && plan.ma20 < plan.ma50) { trend = 'red'; trendText = '空頭排列'; }
      else if (plan.last > plan.ma20) trendText = '站上 MA20';
      else trendText = '跌破 MA20';

      let mom = 'yellow', momText = '中性';
      const r = plan.lastRsi;
      if (r != null) {
        if (r >= 70) { mom = 'red'; momText = '超買 ' + r.toFixed(0); }
        else if (r <= 30) { mom = 'green'; momText = '超賣 ' + r.toFixed(0); }
        else if (r >= 55) { mom = 'green'; momText = '偏多 ' + r.toFixed(0); }
        else if (r <= 45) { mom = 'red'; momText = '偏空 ' + r.toFixed(0); }
        else momText = '中性 ' + r.toFixed(0);
      }

      const atrPct = plan.lastAtr / plan.last * 100;
      let vol = 'yellow', volText = atrPct.toFixed(2) + '%';
      if (atrPct < 1.5) { vol = 'green'; volText = '偏低 ' + atrPct.toFixed(2) + '%'; }
      else if (atrPct > 4) { vol = 'red'; volText = '偏高 ' + atrPct.toFixed(2) + '%'; }
      else volText = '正常 ' + atrPct.toFixed(2) + '%';

      let dir = 'yellow', dirText = plan.direction;
      if (plan.direction.indexOf('做多') >= 0) dir = 'green';
      else if (plan.direction.indexOf('做空') >= 0) dir = 'red';
      else dirText = '觀望';

      let go = 'wait', goTitle = '⏳ 暫時觀望', goSub = '訊號不足，不建議立刻開單。';
      if (plan.direction.indexOf('做多') >= 0) {
        if (mom === 'red' || (r != null && r >= 70)) {
          go = 'wait'; goTitle = '⚠️ 偏多但動能超買'; goSub = '方向做多，RSI 偏高，等回檔再多較佳。';
        } else if (vol === 'red') {
          go = 'wait'; goTitle = '⚠️ 偏多但波動過大'; goSub = '建議降槓桿或縮小倉位。';
        } else {
          go = 'yes'; goTitle = '✅ 適合開多單'; goSub = '與下方參數一致：建議做多，並設停損。';
        }
      } else if (plan.direction.indexOf('做空') >= 0) {
        if (mom === 'green' || (r != null && r <= 30)) {
          go = 'wait'; goTitle = '⚠️ 偏空但動能背離'; goSub = '方向做空，但有反彈風險，等動能轉弱再空。';
        } else if (vol === 'red') {
          go = 'wait'; goTitle = '⚠️ 偏空但波動過大'; goSub = '建議降槓桿或縮小倉位。';
        } else {
          go = 'yes'; goTitle = '✅ 適合開空單'; goSub = '與下方參數一致：建議做空，並設停損。';
        }
      } else {
        goSub = '系統方向為觀望，下方參數僅作風險參考。';
      }
      if (vol === 'red' && r != null && (r > 75 || r < 25)) {
        go = 'no'; goTitle = '🚫 不適合開單'; goSub = '波動過大且動能極端，不建議追價。';
      }

      return {
        items: [
          { lab: '趨勢結構', level: trend, val: trendText },
          { lab: '動能 RSI', level: mom, val: momText },
          { lab: '波動 ATR', level: vol, val: volText },
          { lab: '系統方向', level: dir, val: dirText }
        ],
        go, goTitle, goSub
      };
    }

    function lightClass(level) {
      if (level === 'green') return 'light-green';
      if (level === 'yellow') return 'light-yellow';
      return 'light-red';
    }

    function renderDashboard(sig) {
      const el = document.getElementById('dashboard');
      if (!el || !sig) return;
      const goClass = sig.go === 'yes' ? 'go-yes' : (sig.go === 'no' ? 'go-no' : 'go-wait');
      let html = '<div class="go-banner ' + goClass + '"><div class="go-title">' + sig.goTitle +
        '</div><div class="go-sub">' + sig.goSub + '</div></div><div class="signal-board">';
      sig.items.forEach(it => {
        html += '<div class="signal-cell"><div class="lab">' + it.lab + '</div>' +
          '<div class="light ' + lightClass(it.level) + '"></div><div class="val">' + it.val + '</div></div>';
      });
      html += '</div>';
      el.innerHTML = html;
    }

    function renderCandle(ohlc) {
      const el = document.getElementById('btcCandle');
      if (!el || typeof LightweightCharts === 'undefined') return;
      el.innerHTML = '';
      const chart = LightweightCharts.createChart(el, {
        width: el.clientWidth, height: 280,
        layout: { background: { color: '#161b22' }, textColor: '#8b9bb4' },
        grid: { vertLines: { color: 'rgba(42,51,64,0.5)' }, horzLines: { color: 'rgba(42,51,64,0.5)' } },
        rightPriceScale: { borderColor: '#2a3340' },
        timeScale: { borderColor: '#2a3340', timeVisible: true }
      });
      const series = chart.addCandlestickSeries({
        upColor: '#22c55e', downColor: '#ef4444',
        borderUpColor: '#22c55e', borderDownColor: '#ef4444',
        wickUpColor: '#22c55e', wickDownColor: '#ef4444'
      });
      const data = ohlc.map(x => ({ time: x.time, open: x.o, high: x.h, low: x.l, close: x.c }))
        .sort((a, b) => a.time - b.time);
      const uniq = [];
      const seen = {};
      data.forEach(d => { if (!seen[d.time]) { seen[d.time] = 1; uniq.push(d); } });
      series.setData(uniq);
      const closes = ohlc.map(x => x.c);
      const ma20 = sma(closes, 20);
      const maLine = chart.addLineSeries({ color: '#f7931a', lineWidth: 1, priceLineVisible: false });
      maLine.setData(ohlc.map((x, i) => ma20[i] != null ? { time: x.time, value: ma20[i] } : null).filter(Boolean));
      chart.timeScale().fitContent();
      candleChart = chart;
      window.addEventListener('resize', () => {
        if (candleChart && el) candleChart.applyOptions({ width: el.clientWidth });
      });
    }

    function openBinance() {
      window.open('https://www.binance.com/zh-TC/futures/BTCUSDT', '_blank', 'noopener');
    }

    function copyText(t, msg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(() => alert(msg || '已複製')).catch(() => prompt('請手動複製', t));
      } else prompt('請手動複製', t);
    }

    function copyParams(field) {
      const p = lastPlan;
      if (!p) { alert('尚無參數'); return; }
      if (field === 'entry') return copyText(p.entry.toFixed(2), '已複製進場');
      if (field === 'sl') return copyText(p.sl.toFixed(2), '已複製停損');
      if (field === 'tp1') return copyText(p.tp1.toFixed(2), '已複製停利1');
      if (field === 'tp2') return copyText(p.tp2.toFixed(2), '已複製停利2');
      if (field === 'leverage') return copyText(String(p.leverage), '已複製槓桿');
      copyText([
        'BTCUSDT 參考參數（非自動下單）',
        '方向: ' + p.direction,
        '槓桿: ' + p.leverage + 'x',
        '進場: ' + p.entry.toFixed(2),
        '停損: ' + p.sl.toFixed(2),
        '停利1: ' + p.tp1.toFixed(2),
        '停利2: ' + p.tp2.toFixed(2),
        '',
        '請在幣安手動填入。'
      ].join('\n'), '已複製全部參數');
    }

    async function loadSpot() {
      const loading = document.getElementById('spotLoading');
      const content = document.getElementById('spotContent');
      loading.style.display = 'block'; content.style.display = 'none';
      try {
        const res = await fetch(CG + '/simple/price?ids=bitcoin&vs_currencies=usd,twd&include_24hr_change=true');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const b = data.bitcoin;
        const usd = b.usd, twd = b.twd;
        const chUsd = b.usd_24h_change, chTwd = b.twd_24h_change;
        document.getElementById('priceUsd').textContent = '$' + usd.toLocaleString('en-US', { maximumFractionDigits: 0 });
        document.getElementById('priceTwd').textContent = 'NT$' + Math.round(twd).toLocaleString();
        document.getElementById('priceMbtc').textContent = 'NT$' + Math.round(twd / 1000).toLocaleString();
        document.getElementById('priceUnit').textContent = 'NT$' + Math.round(twd).toLocaleString();
        const fmt = (v) => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
        const cls = (v) => v >= 0 ? 'change-up' : 'change-down';
        document.getElementById('changeUsd').innerHTML = '<span class="' + cls(chUsd) + '">24h ' + fmt(chUsd) + '</span>';
        document.getElementById('changeTwd').innerHTML = '<span class="' + cls(chTwd) + '">24h ' + fmt(chTwd) + '</span>';
        document.getElementById('updatedAt').textContent = 'CoinGecko · ' + new Date().toLocaleString('zh-TW');
        loading.style.display = 'none'; content.style.display = 'block';
      } catch (e) {
        loading.textContent = '載入失敗：' + (e.message || e);
      }
    }

    async function loadPanel() {
      const status = document.getElementById('panelStatus');
      const body = document.getElementById('panelBody');
      status.className = 'status'; status.textContent = '載入 K 線與訊號…';
      try {
        const ohlc = await fetchOhlc(days);
        if (!ohlc.length) throw new Error('無 K 線資料');
        renderCandle(ohlc);
        const plan = buildPlan(ohlc);
        lastPlan = plan;
        renderDashboard(buildSignals(plan));

        let html = '<div class="price-grid" style="margin-bottom:12px">' +
          '<div class="price-box"><div class="label">最新</div><div class="value">$' +
          plan.last.toLocaleString(undefined, { maximumFractionDigits: 0 }) +
          '</div><div class="sub">OHLC 收盤</div></div>' +
          '<div class="price-box"><div class="label">RSI(14)</div><div class="value">' +
          (plan.lastRsi != null ? plan.lastRsi.toFixed(1) : '—') + '</div><div class="sub">' +
          (plan.lastRsi > 70 ? '超買' : plan.lastRsi < 30 ? '超賣' : '中性') + '</div></div>' +
          '<div class="price-box"><div class="label">ATR(14)</div><div class="value">$' +
          plan.lastAtr.toFixed(0) + '</div><div class="sub">波動參考</div></div>' +
          '<div class="price-box"><div class="label">MA20 / MA50</div><div class="value" style="font-size:0.95rem">$' +
          (plan.ma20 ? plan.ma20.toFixed(0) : '—') + ' / $' + (plan.ma50 ? plan.ma50.toFixed(0) : '—') +
          '</div><div class="sub">均線</div></div></div>';

        const boxClass = plan.direction.indexOf('觀望') >= 0 ? 'advice-box' : 'advice-box strong-buy';
        html += '<div class="' + boxClass + '"><h3 style="margin-bottom:8px">BTCUSDT 開單參數</h3>' +
          '<p style="font-size:0.8rem;color:var(--muted);margin-bottom:8px">與上方結論同一套計算。非投資建議，無法代你下單。</p>' +
          '<div class="table-wrap"><table><tbody>' +
          '<tr><td>方向</td><td><strong>' + plan.direction + '</strong></td></tr>' +
          '<tr><td>建議槓桿</td><td><strong>' + plan.leverage + 'x</strong></td></tr>' +
          '<tr><td>參考進場</td><td>$' + plan.entry.toFixed(2) + '</td></tr>' +
          '<tr><td>停損 SL</td><td>$' + plan.sl.toFixed(2) + '</td></tr>' +
          '<tr><td>停利 TP1</td><td>$' + plan.tp1.toFixed(2) + '（R:R ' + plan.rr1.toFixed(1) + '）</td></tr>' +
          '<tr><td>停利 TP2</td><td>$' + plan.tp2.toFixed(2) + '（R:R ' + plan.rr2.toFixed(1) + '）</td></tr>' +
          '</tbody></table></div>' +
          '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">' +
          '<button type="button" class="refresh-btn" style="margin:0;border-color:var(--accent);color:var(--accent);font-weight:700" onclick="openBinance()">① 開啟幣安 BTCUSDT</button>' +
          '<button type="button" class="refresh-btn" style="margin:0" onclick="copyParams()">② 複製全部參數</button>' +
          '<button type="button" class="refresh-btn" style="margin:0" onclick="copyParams(\'entry\')">進場</button>' +
          '<button type="button" class="refresh-btn" style="margin:0" onclick="copyParams(\'sl\')">停損</button>' +
          '<button type="button" class="refresh-btn" style="margin:0" onclick="copyParams(\'tp1\')">停利1</button>' +
          '<button type="button" class="refresh-btn" style="margin:0" onclick="copyParams(\'tp2\')">停利2</button>' +
          '<button type="button" class="refresh-btn" style="margin:0" onclick="copyParams(\'leverage\')">槓桿</button>' +
          '</div>' +
          '<p style="font-size:0.78rem;color:var(--muted);margin-top:10px">請用官方 https 合約頁；參數需在幣安手動填入。</p></div>';

        body.innerHTML = html;
        status.className = 'status live';
        status.textContent = 'CoinGecko OHLC · ' + ohlc.length + ' 根 · ' + new Date().toLocaleString('zh-TW');
      } catch (e) {
        console.error(e);
        status.className = 'status fallback';
        status.textContent = '載入失敗：' + (e.message || e);
        body.innerHTML = '<p class="loading">' + (e.message || e) + '</p>';
      }
    }

    async function loadKAnalysis() {
      const loading = document.getElementById('kLoading');
      const content = document.getElementById('kContent');
      const grid = document.getElementById('kGrid');
      loading.style.display = 'block'; content.style.display = 'none';
      try {
        const periods = [
          { d: 7, label: '7 天' },
          { d: 30, label: '30 天' },
          { d: 90, label: '90 天' },
          { d: 180, label: '半年' },
          { d: 365, label: '1 年' }
        ];
        let html = '';
        for (const p of periods) {
          const ohlc = await fetchOhlc(p.d);
          if (ohlc.length < 5) continue;
          const closes = ohlc.map(x => x.c);
          const first = closes[0], last = closes[closes.length - 1];
          const ret = ((last - first) / first) * 100;
          const high = Math.max(...ohlc.map(x => x.h));
          const low = Math.min(...ohlc.map(x => x.l));
          const pos = (last - low) / (high - low || 1);
          let rec = '持有觀望', recClass = 'rec-hold';
          if (ret > 8 && pos < 0.7) { rec = '偏多可留意'; recClass = 'rec-buy'; }
          else if (ret < -8 || pos > 0.85) { rec = '偏慎'; recClass = 'rec-wait'; }
          html += '<div class="k-card"><h4>' + p.label + ' <span class="rec ' + recClass + '">' + rec +
            '</span></h4><div class="meta">漲跌 ' + (ret >= 0 ? '+' : '') + ret.toFixed(1) +
            '% · 位置 ' + (pos * 100).toFixed(0) + '%</div>' +
            '<div class="meta">高 $' + high.toFixed(0) + ' · 低 $' + low.toFixed(0) +
            ' · 收 $' + last.toFixed(0) + '</div></div>';
          await new Promise(r => setTimeout(r, 350));
        }
        grid.innerHTML = html || '<p class="loading">暫無資料</p>';
        loading.style.display = 'none'; content.style.display = 'block';
      } catch (e) {
        loading.textContent = '分析失敗：' + (e.message || e);
      }
    }

    document.querySelectorAll('#periodBtns button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#periodBtns button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        days = parseInt(btn.dataset.days, 10);
        loadPanel();
      });
    });

    loadSpot();
    setTimeout(loadPanel, 400);
    setTimeout(loadKAnalysis, 800);
  </script>
</body>
</html>
