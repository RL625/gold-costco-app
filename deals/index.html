<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>好市多特價專區</title>
<style>
:root{--bg:#0b0f14;--card:#141c27;--bd:#243044;--a:#0a84ff;--mu:#8b9bb4;--g:#22c55e;--r:#ef4444;--o:#f59e0b;--w:#e8eef7;--hdr:#1a2433;--gold:#eab308;--star:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:15px}
body{background:var(--bg);color:var(--w);font-family:system-ui,-apple-system,sans-serif;max-width:1280px;margin:0 auto;padding:0 8px 48px;-webkit-text-size-adjust:100%}
header{text-align:center;padding:12px 0 8px;border-bottom:1px solid var(--bd);margin-bottom:6px}
header h1{font-size:clamp(1.1rem,3.5vw,1.45rem)}
header .sub{color:var(--mu);font-size:.78rem;margin-top:4px}
header .sub a{color:var(--a);text-decoration:none;margin:0 6px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.toolbar input{flex:1;min-width:100px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;color:var(--w);font-size:.88rem}
.label{font-size:.68rem;color:var(--mu);font-weight:600;letter-spacing:.04em;margin:6px 0 3px}
.tabs-main{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.tabs-main button{background:var(--card);border:2px solid var(--bd);color:var(--w);padding:7px 14px;border-radius:10px;cursor:pointer;font-size:.82rem;font-weight:600}
.tabs-main button.on{background:var(--a);border-color:var(--a);color:#fff}
.tabs-main button.cat-apple.on{background:#555;border-color:#a1a1aa}
.tabs-main button.cat-metal.on{background:#854d0e;border-color:var(--gold);color:#fef9c3}
.tabs-main button.cat-fav.on{background:#422006;border-color:var(--star);color:var(--star)}
.tabs-sub{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px;padding:6px 0;border-top:1px dashed var(--bd)}
.tabs-sub button{background:transparent;border:1px solid var(--bd);color:var(--mu);padding:3px 9px;border-radius:999px;cursor:pointer;font-size:.7rem}
.tabs-sub button.on{border-color:var(--a);color:var(--a);background:rgba(10,132,255,.12)}
.meta{font-size:.72rem;color:var(--mu);margin:4px 0 6px}
.rbtn{background:var(--card);border:1px solid var(--bd);color:var(--mu);padding:6px 9px;border-radius:8px;cursor:pointer;font-size:.76rem}
.rbtn.on{border-color:var(--a);color:var(--a)}.rbtn.primary{background:var(--a);color:#fff;border-color:var(--a)}.rbtn.primary:disabled{opacity:.55}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:900px;background:var(--card)}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}
th{background:var(--hdr);color:var(--mu);font-size:.68rem;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1}
th:hover{color:var(--a)}th .arrow{opacity:.4;margin-left:2px;font-size:.6rem}th.on{color:var(--a)}th.on .arrow{opacity:1}
td{font-size:.78rem}tr:hover td{background:#1a2433}
.col-fav{text-align:center;width:2.2rem}
.star{cursor:pointer;font-size:1.05rem;color:var(--mu);line-height:1}.star.on{color:var(--star)}
.col-brand{white-space:nowrap;color:var(--a);font-weight:600;cursor:pointer}.col-brand:hover{text-decoration:underline}
.col-name{min-width:10rem;line-height:1.3}
.col-unit{color:var(--mu);font-size:.68rem;white-space:nowrap}
.col-cat{white-space:nowrap;color:var(--mu);font-size:.7rem}
.col-code{color:var(--mu);font-size:.68rem}
.col-price{text-align:right;font-weight:800;font-size:.92rem;white-space:nowrap}
.col-orig{text-align:right;color:var(--mu);font-size:.78rem;white-space:nowrap}
.col-pct{text-align:right;white-space:nowrap;font-weight:700;color:#f97316}
.col-save{text-align:right;white-space:nowrap}
.save-pill{display:inline-block;background:linear-gradient(90deg,#c2410c,#ea580c);color:#fff;font-weight:800;font-size:.74rem;padding:2px 6px;border-radius:5px}
.col-stock{text-align:center}
.col-days{text-align:right;white-space:nowrap;font-weight:600}
.days-ok{color:var(--g)}.days-warn{color:var(--o)}.days-urgent{color:var(--r)}.days-none{color:var(--mu)}
.col-hist{min-width:4.5rem}.spark{display:inline-block;vertical-align:middle}
.col-link{text-align:center}
.badge{display:inline-block;font-size:.64rem;padding:1px 6px;border-radius:999px;font-weight:600}
.in{background:rgba(34,197,94,.22);color:var(--g)}.out{background:rgba(239,68,68,.18);color:var(--r)}.low{background:rgba(245,158,11,.22);color:var(--o)}
.buy{display:inline-block;padding:3px 8px;background:var(--a);color:#fff;border-radius:6px;text-decoration:none;font-size:.68rem;font-weight:600}
.ph{font-size:.6rem;margin-top:1px;font-weight:600}.ph.down{color:#22c55e}.ph.up{color:#ef4444}
footer{text-align:center;padding:14px;color:var(--mu);font-size:.68rem;line-height:1.45}
.empty{text-align:center;padding:28px;color:var(--mu)}
.tag-apple{color:#a1a1aa}.tag-metal{color:var(--gold)}
.brand-info{font-size:.75rem;color:var(--mu);margin:0 0 6px;padding:6px 10px;background:var(--card);border-radius:8px;border:1px solid var(--bd);display:none}
.brand-info.show{display:block}.brand-info b{color:var(--a)}
</style>
</head>
<body>
<header>
  <h1>🔥 好市多特價專區</h1>
  <p class="sub">
    <a href="https://www.costco.com.tw/c/hot-buys" target="_blank" rel="noopener">限時優惠</a>
    <a href="https://www.costco.com.tw/While-Supplies-Last/c/Toogood" target="_blank" rel="noopener">把握優惠</a>
    <a href="https://www.costco.com.tw/c/new_lower_prices" target="_blank" rel="noopener">降價商品</a>
  </p>
</header>
<div class="toolbar">
  <input id="q" type="search" placeholder="搜尋名稱、品牌或編號…" autocomplete="off"/>
  <button class="rbtn" id="btnStock">只看有貨</button>
  <button class="rbtn" id="btnSave">只看有折價</button>
  <button class="rbtn" id="btnCsv">⬇ CSV</button>
  <button class="rbtn primary" id="btnRefresh">🔄 更新</button>
</div>
<div class="label">大分類</div>
<div class="tabs-main" id="tabs"></div>
<div class="label">品牌（點品牌看該品牌全部商品）</div>
<div class="tabs-sub" id="brands"></div>
<div class="brand-info" id="brandInfo"></div>
<p class="meta" id="meta">載入中…</p>
<div class="wrap"><table>
<thead><tr>
  <th data-s="fav" style="text-align:center">★</th>
  <th data-s="brand">品牌 <span class="arrow"></span></th>
  <th data-s="name">商品名稱 <span class="arrow"></span></th>
  <th data-s="unit">單位價 <span class="arrow"></span></th>
  <th data-s="cat">分類 <span class="arrow"></span></th>
  <th data-s="code">編號 <span class="arrow"></span></th>
  <th data-s="orig" style="text-align:right">原價 <span class="arrow"></span></th>
  <th data-s="price" style="text-align:right">售價 <span class="arrow"></span></th>
  <th data-s="pct" style="text-align:right">折扣% <span class="arrow"></span></th>
  <th data-s="save" style="text-align:right">現省 <span class="arrow"></span></th>
  <th data-s="stock" style="text-align:center">庫存 <span class="arrow"></span></th>
  <th data-s="days" style="text-align:right">剩餘 <span class="arrow"></span></th>
  <th data-s="hist">走勢</th>
  <th></th>
</tr></thead>
<tbody id="tbody"></tbody>
</table></div>
<div class="empty" id="empty" style="display:none">沒有符合的商品</div>
<footer>資料來源：costco.com.tw · 點欄位標題可排序 · 收藏與價格歷史存在本機</footer>
<script src="./app.js?v=5"></script>
</body>
</html>
