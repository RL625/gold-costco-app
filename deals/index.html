<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>好市多特價專區</title>
<style>
:root{
  --bg:#0b0f14;--card:#141c27;--bd:#243044;--a:#0a84ff;--mu:#8b9bb4;
  --g:#22c55e;--r:#ef4444;--o:#f59e0b;--w:#e8eef7;--save:#ffb020;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  background:var(--bg);color:var(--w);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  max-width:960px;margin:0 auto;padding:0 10px 40px;
  -webkit-text-size-adjust:100%;
}
header{text-align:center;padding:14px 0 10px;border-bottom:1px solid var(--bd);margin-bottom:8px}
header h1{font-size:clamp(1.15rem,3.8vw,1.55rem);letter-spacing:-.02em}
header p{color:var(--mu);font-size:.8rem;margin-top:4px}
header a{color:var(--a);text-decoration:none;margin:0 4px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.toolbar input{
  flex:1;min-width:110px;background:var(--card);border:1px solid var(--bd);
  border-radius:8px;padding:8px 10px;color:var(--w);font-size:.9rem
}
.toolbar input:focus{outline:none;border-color:var(--a)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.tabs button{
  background:transparent;border:1px solid var(--bd);color:var(--mu);
  padding:5px 10px;border-radius:999px;cursor:pointer;font-size:.78rem
}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a);font-weight:600}
.meta{font-size:.75rem;color:var(--mu);margin:4px 0 8px}
.list{display:flex;flex-direction:column;gap:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:6px 12px;
  padding:10px 12px;
  background:var(--card);
  border-bottom:1px solid var(--bd);
  align-items:start;
}
.row:last-child{border-bottom:none}
.row:hover{background:#1a2433}
.row .name{font-size:.88rem;line-height:1.35;word-break:break-word}
.row .sub{
  font-size:.72rem;color:var(--mu);margin-top:3px;
  display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center
}
.row .right{text-align:right;min-width:8rem}
.price{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;color:#fff}
.save{
  font-size:.9rem;font-weight:800;color:#fff;
  margin-top:4px;line-height:1.35;
  background:linear-gradient(90deg,#c2410c,#ea580c);
  display:inline-block;padding:3px 8px;border-radius:6px;
}
.save .amt{font-size:1.05rem;letter-spacing:-.01em}
.end{font-size:.68rem;color:rgba(255,255,255,.85);font-weight:500;margin-left:4px}
.badge{display:inline-block;font-size:.68rem;padding:1px 6px;border-radius:999px;font-weight:600;line-height:1.4}
.in{background:rgba(34,197,94,.22);color:var(--g)}
.out{background:rgba(239,68,68,.18);color:var(--r)}
.low{background:rgba(245,158,11,.22);color:var(--o)}
.buy{display:inline-block;margin-top:5px;padding:4px 9px;background:var(--a);color:#fff;border-radius:6px;text-decoration:none;font-size:.75rem;font-weight:600}
.rbtn{background:var(--card);border:1px solid var(--bd);color:var(--mu);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:.78rem}
.rbtn.on{border-color:var(--a);color:var(--a)}
.rbtn.primary{background:var(--a);color:#fff;border-color:var(--a)}
.rbtn.primary:disabled{opacity:.55;cursor:wait}
footer{text-align:center;padding:16px;color:var(--mu);font-size:.72rem;line-height:1.45}
.empty{text-align:center;padding:32px;color:var(--mu)}
.nav{margin-top:6px;font-size:.75rem}
.nav a{color:var(--mu)}
.links a{color:var(--a)}
.ph{font-size:.7rem;margin-top:2px;font-weight:600}
.ph.down{color:#22c55e}
.ph.up{color:#ef4444}
@media(min-width:640px){
  .row{padding:11px 14px;gap:8px 16px}
  .price{font-size:1.28rem}
  .save{font-size:.95rem}
  .row .name{font-size:.92rem}
  .row .right{min-width:9rem}
}
@media(min-width:900px){
  body{padding:0 16px 48px}
  .price{font-size:1.32rem}
}
</style>
</head>
<body>
<header>
  <h1>🔥 好市多特價專區</h1>
  <p>限時優惠 · 把握優惠 · 降價商品（完整 350+ 件）</p>
  <p class="links">
    <a href="https://www.costco.com.tw/c/hot-buys" target="_blank" rel="noopener">限時優惠</a>
    <a href="https://www.costco.com.tw/While-Supplies-Last/c/Toogood" target="_blank" rel="noopener">把握優惠</a>
    <a href="https://www.costco.com.tw/c/new_lower_prices" target="_blank" rel="noopener">降價商品</a>
  </p>
  <p class="nav">
    <a href="../">金脈</a> · <a href="../apple/">Apple</a> · <a href="../btc/">比特幣</a> · <a href="../silver/">白銀</a>
  </p>
</header>

<div class="toolbar">
  <input id="q" type="search" placeholder="搜尋名稱或編號…" autocomplete="off"/>
  <button class="rbtn" id="btnStock">只看有貨</button>
  <button class="rbtn" id="btnSave">只看有折價</button>
  <button class="rbtn primary" id="btnRefresh">🔄 更新</button>
</div>
<div class="tabs" id="tabs"></div>

<div class="toolbar" style="margin-top:4px">
  <label style="font-size:.75rem;color:var(--mu)">排序</label>
  <select id="sort" style="background:var(--card);border:1px solid var(--bd);color:var(--w);padding:6px 8px;border-radius:8px;font-size:.8rem">
    <option value="save">折價高→低</option>
    <option value="price_asc">價格低→高</option>
    <option value="price_desc">價格高→低</option>
    <option value="brand">品牌 A→Z</option>
    <option value="name">名稱</option>
  </select>
</div>
<div class="tabs" id="brands" style="margin-top:4px"></div>
<p class="meta" id="meta">載入中…</p>
<div class="list" id="list"></div>
<div class="empty" id="empty" style="display:none">沒有符合的商品</div>
<footer>
  資料來源：costco.com.tw · 價格與庫存以官網為準 · 非官方工具<br>
  價格歷史存在本機瀏覽器，下次價格變動時會顯示曾降／曾漲。
</footer>

<script>
var DATA=null, CAT='全部', BRAND='全部', SORT='save', ONLY_STOCK=false, ONLY_SAVE=false, Q='';
var CATS=['全部','3C家電','食品飲料','日用清潔','服飾','家具家飾','美妝保養','其他'];

function brandOf(x){
  var n=(x.n||'').trim();
  if(!n) return '其他';
  var t=n.split(/\s+/)[0];
  if(/^[0-9$￥]/.test(t)) return '其他';
  return t;
}

function money(p,t){
  if(t && t!=='—') return t.startsWith('$')||t.startsWith('NT')?t:('NT$'+t);
  if(p==null||p==='') return '登入顯示';
  return 'NT$'+Number(p).toLocaleString('zh-TW',{maximumFractionDigits:0});
}
function loadHist(){
  try{ return JSON.parse(localStorage.getItem('costco_ph')||'{}'); }catch(e){ return {}; }
}
function saveHist(h){
  try{ localStorage.setItem('costco_ph', JSON.stringify(h)); }catch(e){}
}
function recordPrices(items, date){
  var h=loadHist();
  items.forEach(function(x){
    if(x.p==null) return;
    var code=String(x.c);
    if(!h[code]) h[code]=[];
    var last=h[code][h[code].length-1];
    if(!last || last.p!==x.p){
      h[code].push({d:date,p:x.p});
      if(h[code].length>8) h[code]=h[code].slice(-8);
    }
  });
  saveHist(h);
}
function priceChange(x){
  var h=loadHist()[String(x.c)];
  if(!h || h.length<2) return '';
  var prev=h[h.length-2].p, cur=h[h.length-1].p;
  if(prev==null||cur==null||prev===cur) return '';
  var diff=cur-prev;
  var pct=((diff/prev)*100).toFixed(1);
  if(diff<0) return '<div class="ph down">↓ 曾降 NT$'+Math.abs(diff).toLocaleString()+' ('+pct+'%)</div>';
  return '<div class="ph up">↑ 曾漲 NT$'+diff.toLocaleString()+' (+'+pct+'%)</div>';
}
function fullUrl(u){
  if(!u) return 'https://www.costco.com.tw/c/hot-buys';
  return u.startsWith('http')?u:('https://www.costco.com.tw'+u);
}
function stockBadge(s){
  if(s===1) return '<span class="badge in">有貨</span>';
  if(s===2) return '<span class="badge low">庫存少</span>';
  return '<span class="badge out">缺貨</span>';
}

function filtered(){
  if(!DATA) return [];
  var list=(DATA.items||[]).slice();
  list=list.filter(function(x){
    if(ONLY_STOCK && x.s!==1) return false;
    if(ONLY_SAVE && !(x.save>0)) return false;
    if(CAT!=='全部' && x.k!==CAT) return false;
    if(Q){
      var s=(x.n+' '+(x.c||'')).toLowerCase();
      if(s.indexOf(Q)<0) return false;
    }
    return true;
  });
  if(BRAND!=='全部') list=list.filter(function(x){return brandOf(x)===BRAND;});
  list.sort(function(a,b){
    var sa=a.s===1?0:(a.s===2?1:2), sb=b.s===1?0:(b.s===2?1:2);
    if(sa!==sb) return sa-sb;
    if(SORT==='save'){ var da=a.save||0,db=b.save||0; if(da!==db) return db-da; }
    else if(SORT==='price_asc'){ return (a.p!=null?a.p:1e12)-(b.p!=null?b.p:1e12); }
    else if(SORT==='price_desc'){ return (b.p!=null?b.p:-1)-(a.p!=null?a.p:-1); }
    else if(SORT==='brand'){ var ba=brandOf(a),bb=brandOf(b); if(ba!==bb) return ba.localeCompare(bb,'zh-TW'); }
    else if(SORT==='name'){ return (a.n||'').localeCompare(b.n||'','zh-TW'); }
    var da=a.save||0, db=b.save||0;
    if(da!==db) return db-da;
    return (a.p!=null?a.p:1e12)-(b.p!=null?b.p:1e12);
  });
  return list;
}

function render(){
  var list=filtered();
  var el=document.getElementById('list');
  var empty=document.getElementById('empty');
  var meta=document.getElementById('meta');
  var total=(DATA&&DATA.items)?DATA.items.length:0;
  var inStock=0, outStock=0, withSave=0;
  if(DATA&&DATA.items){
    DATA.items.forEach(function(x){
      if(x.s===1) inStock++; else outStock++;
      if(x.save>0) withSave++;
    });
  }
  meta.textContent='顯示 '+list.length+' 件 · 共 '+total+' 件（有貨 '+inStock+' / 缺貨 '+outStock+' · 有折價 '+withSave+'） · 更新 '+(DATA&&DATA.updated?DATA.updated:'—');
  if(!list.length){ el.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  el.innerHTML=list.map(function(x){
    var saveHtml='';
    if(x.save>0){
      var amt=x.saveT||('NT$'+Number(x.save).toLocaleString('zh-TW'));
      saveHtml='<div class="save">現省 <span class="amt">'+amt+'</span>'+(x.end?' <span class="end">至 '+x.end+'</span>':'')+'</div>';
    }
    var ph=priceChange(x);
    return '<div class="row">'+
      '<div class="left">'+
        '<div class="name">'+x.n+'</div>'+
        '<div class="sub"><span style="color:var(--a)">'+brandOf(x)+'</span><span>'+x.k+'</span><span>#'+x.c+'</span>'+stockBadge(x.s)+'</div>'+
      '</div>'+
      '<div class="right">'+
        '<div class="price">'+money(x.p,x.t)+'</div>'+
        saveHtml+
        ph+
        '<a class="buy" href="'+fullUrl(x.u)+'" target="_blank" rel="noopener">查看</a>'+
      '</div>'+
    '</div>';
  }).join('');
}

function buildBrands(){
  var counts={};
  (DATA.items||[]).forEach(function(x){
    var b=brandOf(x);
    counts[b]=(counts[b]||0)+1;
  });
  var list=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||a.localeCompare(b,'zh-TW');});
  var el=document.getElementById('brands');
  if(!el) return;
  el.innerHTML='<button data-b="全部" class="'+(BRAND==='全部'?'on':'')+'">全部品牌</button>'+
    list.slice(0,40).map(function(b){
      return '<button data-b="'+b+'" class="'+(b===BRAND?'on':'')+'">'+b+' ('+counts[b]+')</button>';
    }).join('');
  el.onclick=function(e){
    var btn=e.target.closest('button[data-b]'); if(!btn) return;
    BRAND=btn.getAttribute('data-b');
    [].forEach.call(el.querySelectorAll('button'),function(x){x.classList.toggle('on',x===btn);});
    render();
  };
}

function buildTabs(){
  var el=document.getElementById('tabs');
  el.innerHTML=CATS.map(function(c){
    return '<button data-c="'+c+'" class="'+(c===CAT?'on':'')+'">'+c+'</button>';
  }).join('');
  el.onclick=function(e){
    var b=e.target.closest('button[data-c]'); if(!b) return;
    CAT=b.getAttribute('data-c');
    [].forEach.call(el.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});
    render();
  };
}

function loadData(){
  document.getElementById('meta').textContent='載入中…';
  return Promise.all(Array.from({length:20},function(_,i){
    return fetch('./e'+i+'.txt?v='+Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('e'+i+' HTTP '+r.status);
      return r.text();
    });
  })).then(function(arr){
    /* patch 3 single-char push corruptions */
    var a=arr.map(function(t){return t.trim();});
    if(a[0] && a[0].length>1301 && a[0][1301]==='g') a[0]=a[0].slice(0,1301)+'m'+a[0].slice(1302);
    if(a[7] && a[7].length>1020 && a[7][1020]==='t') a[7]=a[7].slice(0,1020)+'d'+a[7].slice(1021);
    if(a[16] && a[16].length>1023){
      if(a[16][1022]==='z' && a[16][1023]==='q') a[16]=a[16].slice(0,1022)+'qd'+a[16].slice(1024);
    }
    var b64=a.join('');
    var bin=atob(b64), len=bin.length, u8=new Uint8Array(len);
    for(var i=0;i<len;i++) u8[i]=bin.charCodeAt(i);
    return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }).then(function(ab){
    DATA=JSON.parse(new TextDecoder().decode(ab));
    recordPrices(DATA.items||[], DATA.updated||'2026-11-16');
    buildTabs();
    buildBrands();
    render();
    return DATA;
  });
}

document.getElementById('sort').onchange=function(){ SORT=this.value; render(); };

document.getElementById('q').addEventListener('input',function(e){
  Q=(e.target.value||'').trim().toLowerCase(); render();
});
document.getElementById('btnStock').onclick=function(){
  ONLY_STOCK=!ONLY_STOCK;
  this.textContent=ONLY_STOCK?'顯示全部':'只看有貨';
  this.classList.toggle('on',ONLY_STOCK);
  render();
};
document.getElementById('btnSave').onclick=function(){
  ONLY_SAVE=!ONLY_SAVE;
  this.textContent=ONLY_SAVE?'顯示全部':'只看有折價';
  this.classList.toggle('on',ONLY_SAVE);
  render();
};
document.getElementById('btnRefresh').onclick=function(){
  var btn=this;
  btn.disabled=true; btn.textContent='更新中…';
  loadData().then(function(){
    btn.textContent='✅ 已更新';
    setTimeout(function(){ btn.textContent='🔄 更新'; btn.disabled=false; },1400);
  }).catch(function(e){
    document.getElementById('meta').textContent='更新失敗：'+(e.message||e);
    btn.textContent='🔄 更新'; btn.disabled=false;
  });
};

loadData().catch(function(e){
  document.getElementById('meta').textContent='載入失敗：'+(e.message||e);
});
</script>
</body>
</html>
